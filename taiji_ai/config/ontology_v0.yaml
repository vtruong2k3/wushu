# Ontology v0 for the 24-form Taijiquan (P1.04). Validated by taiji_ai.schemas.ontology.
#
# STATUS: draft_unconfirmed. The list below is written by us from the commonly taught numbered list of the 24-form;
# the coach (H) has not confirmed it (AGENTS.md §5.12). Nothing may treat it as confirmed until `status: confirmed`
# with `confirmed_by` (a role) and `confirmed_at` (ISO date) is set by the person who reviewed it.
# English and Vietnamese names are our own wording; no text is copied from any third-party source (AGENTS.md §9.1).
# The Vietnamese (Sino-Vietnamese) readings were written from general knowledge and were not checked against a
# source or a native reader; the coach or a Vietnamese-speaking reviewer confirms them with the rest.
#
# Open questions for H (see Docs/tasks/P1.04.md):
#   Q3  Is this the variant and the division into 24 numbered movements that the coach teaches?
#   Q5  Movements that alternate sides inside one number list both sides and a repetition count; movements numbered
#       per side (A07/A08, A16/A17) have one side each. Is that how the coach counts them?
#   Q6  May a reference for one number come from the other number of the same `technique`? (decided in P6.05)
#   Q7  Sub-phases inside a movement are not part of v0 (the `segment` table has no column for them).
#   Q8  Which side each repetition uses is given by `side_sequence` only where names or sources point to one order
#       (A02, A04, A18; each marked provisional below). A06 and A10 have none: no source read gives their order, and
#       an action without a sequence is not checked for side/occurrence pairing.
#   Q9  What does a side mean (leading foot, working hand or direction of the turn)? Which side label does a segment
#       get when it covers a whole alternating movement (no occurrence)? The validator accepts any listed side then.
#       Searched 2026-11-15 (X.19), no authoritative answer found (search-engine summaries; no textbook page could be
#       read): the results disagree on the order of A06 (one lists right first, others left first); one says the left
#       version of A16 stands on the left leg; nothing on kicks; none says whether a name follows the hand or the foot.
#       Working convention (agreed by the maintainer 2026-11-15, DEC-0024; a coach may change it): the side label is
#       the left/right word of the movement's standard name; for movements that step forward that is the front foot.
#       The kicks (A13, A15) and the independent stands (A16, A17) follow their names as listed. A06 and A10 have no
#       sequence (their names give no order of repetitions). A18: the name here (左右穿梭) says left first, but the
#       sequence is right, left, taken from two sources that call it 右左玉女穿梭, so the name order does not settle it.
#       Still open: the label of a segment that covers a whole alternating movement.
#       Details: Docs/tasks/X.19.md, Docs/tasks/X.20.md. This is not a coach sign-off: the status stays draft.
#
# Source check (X.18, 2026-11-15; facts only, see Docs/tasks/X.18.md section 1.1): three public pages (English and
# Chinese Wikipedia, one commercial blog) agree with this list on all 24 numbers and Chinese names, so Q3 and Q5 are
# supported but not confirmed. None of them gives repetition counts; one low-authority article gives 3, 3, 4, 3, 2 for
# A02, A04, A06, A10, A18 (equal to this file). A18 is named "right and left" by two of them. No Vietnamese source was found.
#   Repetitions to confirm: A06 (4 here; some teachers do 3) and A10 (3 here; some teachers do 4).
#
# Adding or renaming a label after segments exist needs a migration note: bump `ontology_version`.

schema_version: ontology/1
ontology_version: v0

form:
  id: taiji24
  name_en: Simplified 24-form Taijiquan
  expected_actions: 24
  status: draft_unconfirmed

# Allowed values. `none` = the movement has no side. `view_categories` must equal the CHECK list of
# segment.view_category in migrations/0001_init.sql (test T-DATA-01f).
sides: [left, right, none]
view_categories: [front, side, oblique, back, unknown]
flags: [orientation_change, occlusion, perspective_shift]

# One action = one numbered movement of the form. `sides` = the sides that occur inside it; `repetitions` = how often
# it is performed inside the number (a segment's `occurrence` is 1..repetitions); `technique` is shared by numbers
# that are the same technique.
